<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>On-going - CN Novel-Translation</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="header-left">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Buka menu"
            aria-expanded="false"
        >
            ☰
        </button>

    </div>


    <div class="site-title">
        CN Novel-Translation
    </div>


    <div class="header-right">

        <button
            class="theme-button"
            id="themeButton"
            aria-label="Ganti tema"
        >
            ☀️
        </button>

    </div>

</header>



<!-- =====================================================
     SIDE MENU
===================================================== -->

<nav class="side-menu" id="sideMenu">

    <div class="menu-header">

        <span>Menu</span>

        <button
            class="menu-close"
            id="menuClose"
            aria-label="Tutup menu"
        >
            ×
        </button>

    </div>


    <div
        class="menu-parent"
        id="menuNovel"
        role="button"
        tabindex="0"
        aria-expanded="false"
    >

        <span>Novel</span>

        <span class="menu-arrow">›</span>

    </div>


    <div class="novel-submenu" id="novelSubmenu">

        <a href="on-going.html">
            On-going
        </a>

        <a href="completed.html">
            Completed
        </a>

        <a href="hiatus.html">
            Hiatus
        </a>

        <a href="drop.html">
            Drop
        </a>

    </div>


    <a class="menu-item" href="../index.html">
        <span>Bookmark</span>
    </a>


    <a class="menu-item" href="#donasi">
        <span>Donasi</span>
    </a>


    <a class="menu-item" href="#login">
        <span>Login</span>
    </a>

</nav>


<div class="menu-overlay" id="menuOverlay"></div>



<!-- =====================================================
     SEARCH
===================================================== -->

<div class="global-search-bar">

    <div class="global-search-inner">

        <div class="search-box">

            <span class="search-icon">🔍</span>

            <input
                type="search"
                id="searchInput"
                placeholder="Cari novel..."
                autocomplete="off"
            >

        </div>

    </div>

</div>



<!-- =====================================================
     CONTENT
===================================================== -->

<main class="home-container">


    <section class="home-section">

        <div class="section-heading">

            <h2>On-going</h2>

        </div>


        <div class="latest-updates" id="ongoingNovels"></div>


        <div class="pagination" id="pagination"></div>

    </section>



    <!-- SEARCH RESULT -->

    <section
        class="home-section"
        id="searchResultsSection"
        style="display: none;"
    >

        <div class="section-heading">

            <h2>Hasil Pencarian</h2>

        </div>


        <div
            class="latest-updates"
            id="searchResults"
        ></div>

    </section>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="footer-title">
        CN Novel-Translation
    </div>


    <div class="footer-links">

        <a href="../index.html">
            Home
        </a>

        <span>•</span>

        <a href="#donasi">
            Donasi
        </a>

    </div>


    <p class="copyright">
        © Copyright 2026-CN Novel-Translation
    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   MENU
===================================================== */

const menuButton = document.getElementById("menuButton");
const menuClose = document.getElementById("menuClose");
const menuOverlay = document.getElementById("menuOverlay");
const sideMenu = document.getElementById("sideMenu");

const menuNovel = document.getElementById("menuNovel");
const novelSubmenu = document.getElementById("novelSubmenu");


function openMenu() {

    sideMenu.classList.add("active");

    menuOverlay.classList.add("active");

    document.body.classList.add("menu-open");

    menuButton.setAttribute(
        "aria-expanded",
        "true"
    );

}


function closeNovelSubmenu() {

    novelSubmenu.classList.remove("active");

    menuNovel.classList.remove("active");

    menuNovel.setAttribute(
        "aria-expanded",
        "false"
    );

}


function closeMenu() {

    sideMenu.classList.remove("active");

    menuOverlay.classList.remove("active");

    document.body.classList.remove("menu-open");

    closeNovelSubmenu();

    menuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}


menuButton.addEventListener(
    "click",
    openMenu
);


menuClose.addEventListener(
    "click",
    closeMenu
);


menuOverlay.addEventListener(
    "click",
    closeMenu
);



function toggleNovelSubmenu() {

    const isActive =
        novelSubmenu.classList.toggle("active");

    menuNovel.classList.toggle(
        "active",
        isActive
    );

    menuNovel.setAttribute(
        "aria-expanded",
        isActive
    );

}


menuNovel.addEventListener(
    "click",
    toggleNovelSubmenu
);


menuNovel.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            toggleNovelSubmenu();

        }

    }
);


const menuLinks =
    sideMenu.querySelectorAll("a");


menuLinks.forEach(function (link) {

    link.addEventListener(
        "click",
        function () {

            closeMenu();

        }
    );

});


document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {

            closeMenu();

        }

    }
);



/* =====================================================
   DARK / LIGHT MODE
===================================================== */

const themeButton =
    document.getElementById("themeButton");


function loadTheme() {

    const savedTheme =
        localStorage.getItem("theme");


    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        themeButton.textContent = "🌙";

    } else {

        document.body.classList.remove("dark");

        themeButton.textContent = "☀️";

    }

}


themeButton.addEventListener(
    "click",
    function () {

        document.body.classList.toggle("dark");


        if (
            document.body.classList.contains("dark")
        ) {

            localStorage.setItem(
                "theme",
                "dark"
            );

            themeButton.textContent = "🌙";

        } else {

            localStorage.setItem(
                "theme",
                "light"
            );

            themeButton.textContent = "☀️";

        }

    }
);


loadTheme();


window.addEventListener(
    "pageshow",
    function () {

        loadTheme();

    }
);



/* =====================================================
   DATA NOVEL
===================================================== */

const novels = [

    {
        title: "Contoh Novel A",
        genre: "Fantasy • Romance",
        status: "On-going",
        cover: "../images/cover.jpg",
        chapter: 25,
        chapterTitle: "Chapter 25",
        link: "judul-novel.html"
    },


    {
        title: "Contoh Novel B",
        genre: "Xianxia • Romance",
        status: "On-going",
        cover: "../images/cover.jpg",
        chapter: 103,
        chapterTitle: "Chapter 103",
        link: "#"
    },


    {
        title: "Contoh Novel E",
        genre: "Fantasy • Adventure",
        status: "On-going",
        cover: "../images/cover.jpg",
        chapter: 68,
        chapterTitle: "Chapter 68",
        link: "#"
    },


    {
        title: "Contoh Novel F",
        genre: "Xianxia • Fantasy",
        status: "On-going",
        cover: "../images/cover.jpg",
        chapter: 91,
        chapterTitle: "Chapter 91",
        link: "#"
    }

];



/* =====================================================
   CARD NOVEL
===================================================== */

function createNovelCard(novel) {

    return `

        <article class="random-novel-card">

            <a
                href="${novel.link}"
                style="
                    display:flex;
                    gap:14px;
                    width:100%;
                "
            >

                <img
                    src="${novel.cover}"
                    alt="${novel.title}"
                >


                <div class="random-novel-info">

                    <h3>
                        ${novel.title}
                    </h3>


                    <p>
                        ${novel.genre}
                    </p>


                    <span>
                        ${novel.chapterTitle}
                    </span>

                </div>

            </a>

        </article>

    `;

}



/* =====================================================
   PAGINATION
===================================================== */

const novelsPerPage = 10;

let currentPage = 1;


function showNovels(page = 1) {

    const container =
        document.getElementById("ongoingNovels");


    const start =
        (page - 1) * novelsPerPage;


    const end =
        start + novelsPerPage;


    const pageNovels =
        novels.slice(start, end);


    container.innerHTML =
        pageNovels
            .map(createNovelCard)
            .join("");


    showPagination(page);

}



function showPagination(page) {

    const pagination =
        document.getElementById("pagination");


    const totalPages =
        Math.ceil(
            novels.length / novelsPerPage
        );


    pagination.innerHTML = "";


    for (
        let i = 1;
        i <= totalPages;
        i++
    ) {

        const button =
            document.createElement("button");


        button.textContent = i;


        if (i === page) {

            button.classList.add(
                "active"
            );

        }


        button.addEventListener(
            "click",
            function () {

                currentPage = i;

                showNovels(i);

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );


        pagination.appendChild(button);

    }

}



/* =====================================================
   SEARCH
===================================================== */

const searchInput =
    document.getElementById("searchInput");


const searchResultsSection =
    document.getElementById(
        "searchResultsSection"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


function performSearch(keyword) {

    keyword =
        keyword
            .trim()
            .toLowerCase();


    if (!keyword) {

        searchResultsSection.style.display =
            "none";


        document.querySelector(
            ".home-section"
        ).style.display = "";


        return;

    }


    const results =
        novels.filter(function (novel) {

            return novel.title
                .toLowerCase()
                .includes(keyword);

        });


    document.querySelector(
        ".home-section"
    ).style.display = "none";


    searchResultsSection.style.display =
        "";


    if (results.length === 0) {

        searchResults.innerHTML =
            '<p class="no-results">Tidak ada novel yang ditemukan.</p>';

        return;

    }


    searchResults.innerHTML =
        results
            .map(createNovelCard)
            .join("");

}


searchInput.addEventListener(
    "input",
    function () {

        performSearch(
            searchInput.value
        );

    }
);



/* =====================================================
   LOAD
===================================================== */

showNovels(1);

</script>


</body>

</html>
