<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CN Novel-Translation</title>


    <!-- FONT NAMA WEBSITE -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap"
        rel="stylesheet"
    >


    <!-- CSS UTAMA -->

    <link rel="stylesheet" href="css/style.css">


    <style>

        /* =====================================================
           MENU MINIMALIS
        ===================================================== */

        .side-menu {
            width: 250px;
        }

        .menu-header {
            min-height: 50px;
            padding: 10px 16px;
        }

        .menu-item {
            min-height: 43px;
            padding: 10px 16px;
            font-size: 15px;
        }

        .menu-novel {
            justify-content: space-between;
        }

        .novel-submenu a {
            padding: 10px 16px 10px 30px;
            font-size: 14px;
        }


        /* =====================================================
           BERANDA
        ===================================================== */

        .home-container {
            max-width: 1100px;
        }

        .home-section {
            margin-bottom: 28px;
        }

        .section-heading {
            margin-bottom: 12px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--border);
        }

        .section-heading h2 {
            margin: 0;
            font-size: 19px;
            line-height: 1.3;
        }


        /* =====================================================
           KARTU NOVEL
        ===================================================== */

        .novel-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .novel-card {
            min-width: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 7px;
            overflow: hidden;

            transition:
                transform 0.2s ease,
                background-color 0.4s ease,
                border-color 0.4s ease;
        }

        .novel-card:hover {
            transform: translateY(-2px);
        }

        .novel-card a {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .novel-card img {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: var(--bg);
        }

        .novel-card-content {
            padding: 9px 10px 10px;
        }

        .novel-card-content h3 {
            margin: 0 0 5px;
            font-size: 15px;
            line-height: 1.35;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .novel-card-content p {
            margin: 0 0 6px;
            color: var(--secondary);
            font-size: 12px;
            line-height: 1.4;
        }

        .novel-card-content span {
            color: var(--primary);
            font-size: 12px;
        }


        /* =====================================================
           PAGINATION
        ===================================================== */

        .pagination {
            margin-top: 16px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .home-container {
                padding:
                    14px 12px 28px;
            }

            .novel-grid {
                gap: 9px;
            }

            .section-heading h2 {
                font-size: 18px;
            }

        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 700px) {

            .novel-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

                gap: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="site-header">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Buka menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <a
            href="index.html"
            class="site-title"
        >
            CN Novel-Translation
        </a>


        <button
            class="theme-button"
            id="themeButton"
            aria-label="Ganti tema"
        >
            ☀️
        </button>

    </header>


    <!-- =====================================================
         MENU OVERLAY
    ===================================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>


    <!-- =====================================================
         SIDE MENU
    ===================================================== -->

    <nav
        class="side-menu"
        id="sideMenu"
    >

        <div class="menu-header">

            <span>
                Menu
            </span>

            <button
                class="menu-close"
                id="menuClose"
                aria-label="Tutup menu"
            >
                ×
            </button>

        </div>


        <!-- NOVEL -->

        <div
            class="menu-item menu-novel"
            id="menuNovel"
            role="button"
            tabindex="0"
            aria-expanded="false"
        >

            <span>
                Novel
            </span>

            <span class="menu-arrow">
                ›
            </span>

        </div>


        <!-- SUBMENU NOVEL -->

        <div class="novel-submenu" id="novelSubmenu">

    <a href="novel/on-going.html">
        On-going
    </a>

    <a href="novel/completed.html">
        Completed
    </a>

    <a href="novel/hiatus.html">
        Hiatus
    </a>

    <a href="novel/drop.html">
        Drop
    </a>

</div>


        <!-- BOOKMARK -->

        <a
    href="bookmark.html"
    class="menu-item"
>
    Bookmark
</a>


        <!-- DONASI -->

        <a
            href="#donasi"
            class="menu-item"
        >
            Donasi
        </a>


        <!-- LOGIN -->

        <a
            href="#login"
            class="menu-item"
        >
            Login
        </a>

    </nav>


    <!-- =====================================================
         SEARCH GLOBAL
    ===================================================== -->

    <div class="global-search-bar">

        <div class="global-search-inner">

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Cari novel..."
                    autocomplete="off"
                >

            </div>

        </div>

    </div>


    <!-- =====================================================
         MAIN / BERANDA
    ===================================================== -->

    <main class="home-container">


        <!-- =================================================
             NOVEL RANDOM
        ================================================= -->

        <section
            class="home-section"
            id="ongoing"
        >

            <div class="section-heading">

                <h2>
                    Novel Random
                </h2>

            </div>


            <div
                class="novel-grid"
                id="randomNovels"
            ></div>

        </section>


        <!-- =================================================
             LATEST UPDATE
        ================================================= -->

        <section
            class="home-section"
            id="latest"
        >

            <div class="section-heading">

                <h2>
                    Latest Update
                </h2>

            </div>


            <div
                class="novel-grid"
                id="latestUpdates"
            ></div>


            <div
                class="pagination"
                id="pagination"
            ></div>

        </section>


        <!-- =================================================
             HASIL PENCARIAN
        ================================================= -->

        <section
            class="home-section"
            id="searchResultsSection"
            style="display: none;"
        >

            <div class="section-heading">

                <h2>
                    Hasil Pencarian
                </h2>

            </div>


            <div
                class="novel-grid"
                id="searchResults"
            ></div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="site-footer">

        <div class="footer-title">
            CN Novel-Translation
        </div>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <span>
                •
            </span>

            <a href="#donasi">
                Donasi
            </a>

        </div>


        <p class="copyright">
            © Copyright 2026-CN Novel-Translation
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        /* =====================================================
           THEME
        ===================================================== */

        const themeButton =
            document.getElementById("themeButton");


        function loadTheme() {

            const savedTheme =
                localStorage.getItem("theme");


            if (savedTheme === "dark") {

                document.body.classList.add("dark");

                themeButton.textContent = "🌙";

            } else {

                document.body.classList.remove("dark");

                themeButton.textContent = "☀️";

            }

        }


        themeButton.addEventListener(
            "click",
            function () {

                document.body.classList.toggle("dark");


                if (
                    document.body.classList.contains("dark")
                ) {

                    localStorage.setItem(
                        "theme",
                        "dark"
                    );

                    themeButton.textContent = "🌙";

                } else {

                    localStorage.setItem(
                        "theme",
                        "light"
                    );

                    themeButton.textContent = "☀️";

                }

            }
        );


        loadTheme();


        window.addEventListener(
            "pageshow",
            function () {

                loadTheme();

            }
        );


        /* =====================================================
           MENU
        ===================================================== */

        const menuButton =
            document.getElementById("menuButton");


        const menuClose =
            document.getElementById("menuClose");


        const menuOverlay =
            document.getElementById("menuOverlay");


        const sideMenu =
            document.getElementById("sideMenu");


        const menuNovel =
            document.getElementById("menuNovel");


        const novelSubmenu =
            document.getElementById("novelSubmenu");


        function openMenu() {

            sideMenu.classList.add("active");

            menuOverlay.classList.add("active");

            document.body.classList.add("menu-open");

            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );

        }


        function closeNovelSubmenu() {

            novelSubmenu.classList.remove("active");

            menuNovel.classList.remove("active");

            menuNovel.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        function closeMenu() {

            sideMenu.classList.remove("active");

            menuOverlay.classList.remove("active");

            document.body.classList.remove("menu-open");

            closeNovelSubmenu();

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        menuButton.addEventListener(
            "click",
            openMenu
        );


        menuClose.addEventListener(
            "click",
            closeMenu
        );


        menuOverlay.addEventListener(
            "click",
            closeMenu
        );


        /* =====================================================
           SUBMENU NOVEL
        ===================================================== */

        function toggleNovelSubmenu() {

            const isActive =
                novelSubmenu.classList.toggle("active");


            menuNovel.classList.toggle(
                "active",
                isActive
            );


            menuNovel.setAttribute(
                "aria-expanded",
                isActive
            );

        }


        menuNovel.addEventListener(
            "click",
            toggleNovelSubmenu
        );


        menuNovel.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    toggleNovelSubmenu();

                }

            }
        );


        /* =====================================================
           MENU LINKS
        ===================================================== */

        const menuLinks =
            sideMenu.querySelectorAll("a");


        menuLinks.forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        closeMenu();

                    }
                );

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeMenu();

                }

            }
        );


        /* =====================================================
           DATA NOVEL
        ===================================================== */

        const novels = [

            {
                title: "Contoh Novel A",
                genre: "Fantasy • Romance",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 25,
                chapterTitle: "Chapter 25",
                link: "novel/judul-novel.html"
            },

            {
                title: "Contoh Novel B",
                genre: "Xianxia • Romance",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 103,
                chapterTitle: "Chapter 103",
                link: "#"
            },

            {
                title: "Contoh Novel C",
                genre: "Fantasy • Wuxia",
                status: "Completed",
                cover: "images/cover.jpg",
                chapter: 17,
                chapterTitle: "Chapter 17",
                link: "#"
            },

            {
                title: "Contoh Novel D",
                genre: "Xuanhuan • Romance",
                status: "Hiatus",
                cover: "images/cover.jpg",
                chapter: 42,
                chapterTitle: "Chapter 42",
                link: "#"
            },

            {
                title: "Contoh Novel E",
                genre: "Fantasy • Adventure",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 68,
                chapterTitle: "Chapter 68",
                link: "#"
            },

            {
                title: "Contoh Novel F",
                genre: "Xianxia • Fantasy",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 91,
                chapterTitle: "Chapter 91",
                link: "#"
            }

        ];


        /* =====================================================
           NOVEL CARD
        ===================================================== */

        function createNovelCard(novel) {

            return `

                <article class="novel-card">

                    <a href="${novel.link}">

                        <img
                            src="${novel.cover}"
                            alt="${novel.title}"
                        >

                        <div class="novel-card-content">

                            <h3>
                                ${novel.title}
                            </h3>

                            <p>
                                ${novel.genre}
                            </p>

                            <span>
                                ${novel.chapterTitle}
                            </span>

                        </div>

                    </a>

                </article>

            `;

        }


        /* =====================================================
           RANDOM NOVEL
        ===================================================== */

        function showRandomNovels() {

            const container =
                document.getElementById(
                    "randomNovels"
                );


            const shuffled =
                [...novels].sort(
                    () => Math.random() - 0.5
                );


            const selected =
                shuffled.slice(0, 3);


            container.innerHTML =
                selected
                    .map(createNovelCard)
                    .join("");

        }


        /* =====================================================
           LATEST UPDATE
        ===================================================== */

        const latestPerPage = 5;

        let currentPage = 1;


        function showLatestUpdates(page = 1) {

            const container =
                document.getElementById(
                    "latestUpdates"
                );


            const start =
                (page - 1) * latestPerPage;


            const end =
                start + latestPerPage;


            const pageNovels =
                novels.slice(start, end);


            container.innerHTML =
                pageNovels
                    .map(createNovelCard)
                    .join("");


            showPagination(page);

        }


        /* =====================================================
           PAGINATION
        ===================================================== */

        function showPagination(page) {

            const pagination =
                document.getElementById(
                    "pagination"
                );


            const totalPages =
                Math.ceil(
                    novels.length /
                    latestPerPage
                );


            pagination.innerHTML = "";


            for (
                let i = 1;
                i <= totalPages;
                i++
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.textContent = i;


                if (i === page) {

                    button.classList.add(
                        "active"
                    );

                }


                button.addEventListener(
                    "click",
                    function () {

                        currentPage = i;

                        showLatestUpdates(i);

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }
                );


                pagination.appendChild(
                    button
                );

            }

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const searchResultsSection =
            document.getElementById(
                "searchResultsSection"
            );


        const searchResults =
            document.getElementById(
                "searchResults"
            );


        function performSearch(keyword) {

            keyword =
                keyword
                    .trim()
                    .toLowerCase();


            const sections =
                document.querySelectorAll(
                    ".home-section"
                );


            if (!keyword) {

                searchResultsSection.style.display =
                    "none";


                sections[0].style.display =
                    "";


                sections[1].style.display =
                    "";


                return;

            }


            const results =
                novels.filter(
                    function (novel) {

                        return novel.title
                            .toLowerCase()
                            .includes(keyword);

                    }
                );


            sections[0].style.display =
                "none";


            sections[1].style.display =
                "none";


            searchResultsSection.style.display =
                "";


            if (results.length === 0) {

                searchResults.innerHTML =
                    '<p class="no-results">Tidak ada novel yang ditemukan.</p>';

                return;

            }


            searchResults.innerHTML =
                results
                    .map(createNovelCard)
                    .join("");

        }


        searchInput.addEventListener(
            "input",
            function () {

                performSearch(
                    searchInput.value
                );

            }
        );


        /* =====================================================
           SEARCH DARI URL
        ===================================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const urlSearch =
            urlParams.get("search");


        if (urlSearch) {

            searchInput.value =
                urlSearch;

            performSearch(
                urlSearch
            );

        }


        /* =====================================================
           LOAD BERANDA
        ===================================================== */

        showRandomNovels();

        showLatestUpdates(1);

    </script>


</body>

</html>
