<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CN Novel-Translation</title>

    <!-- FONT NAMA WEBSITE -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================
           MENU
        ========================= */

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 998;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: min(82vw, 320px);
            height: 100vh;
            background: var(--card);
            color: var(--text);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 999;
            overflow-y: auto;
            box-shadow: 4px 0 18px rgba(0, 0, 0, 0.12);
        }

        .side-menu.active {
            transform: translateX(0);
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 58px;
            padding: 0 14px 0 18px;
            border-bottom: 1px solid var(--border);
        }

        .menu-header span {
            font-size: 18px;
            font-weight: 600;
        }

        .menu-close {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text);
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .menu-close:hover {
            background: var(--bg);
        }

        .menu-item {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 48px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            text-decoration: none;
            font-size: 16px;
            box-sizing: border-box;
            cursor: pointer;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                padding-left 0.2s ease;
        }

        .menu-item:hover {
            background: var(--bg);
            color: var(--primary);
            padding-left: 22px;
        }

        .menu-novel {
            justify-content: space-between;
        }

        .menu-arrow {
            font-size: 22px;
            line-height: 1;
            transition: transform 0.25s ease;
        }

        .menu-novel.active .menu-arrow {
            transform: rotate(90deg);
        }

        /* SUBMENU NOVEL */

        .novel-submenu {
            max-height: 0;
            overflow: hidden;
            background: var(--bg);
            transition:
                max-height 0.3s ease,
                opacity 0.25s ease;
            opacity: 0;
        }

        .novel-submenu.active {
            max-height: 240px;
            opacity: 1;
        }

        .novel-submenu a {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px 0 34px;
            border-bottom: 1px solid var(--border);
            color: var(--secondary);
            text-decoration: none;
            font-size: 15px;
            box-sizing: border-box;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                padding-left 0.2s ease;
        }

        .novel-submenu a:hover {
            background: var(--card);
            color: var(--primary);
            padding-left: 38px;
        }

        body.menu-open {
            overflow: hidden;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            .side-menu {
                width: min(84vw, 310px);
            }

            .menu-header {
                min-height: 56px;
            }

            .menu-item {
                min-height: 47px;
            }

            .novel-submenu a {
                min-height: 43px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="site-header">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Buka menu"
            aria-expanded="false">
            ☰
        </button>

        <a href="index.html" class="site-title">
            CN Novel-Translation
        </a>

        <button
            class="theme-button"
            id="themeButton"
            aria-label="Ganti tema">
            ☀️
        </button>

    </header>


    <!-- =========================
         MENU OVERLAY
    ========================= -->

    <div class="menu-overlay" id="menuOverlay"></div>


    <!-- =========================
         SIDE MENU
    ========================= -->

    <nav class="side-menu" id="sideMenu">

        <div class="menu-header">

            <span>Menu</span>

            <button
                class="menu-close"
                id="menuClose"
                aria-label="Tutup menu">
                ×
            </button>

        </div>


        <!-- NOVEL -->

        <div
            class="menu-item menu-novel"
            id="menuNovel"
            role="button"
            tabindex="0"
            aria-expanded="false">

            <span>Novel</span>

            <span class="menu-arrow">›</span>

        </div>


        <!-- SUBMENU NOVEL -->

        <div
            class="novel-submenu"
            id="novelSubmenu">

            <a href="#ongoing">
                On-going
            </a>

            <a href="#completed">
                Completed
            </a>

            <a href="#hiatus">
                Hiatus
            </a>

            <a href="#drop">
                Drop
            </a>

        </div>


        <!-- MENU LAIN -->

        <a href="#bookmark" class="menu-item">
            Bookmark
        </a>

        <a href="#donasi" class="menu-item">
            Donasi
        </a>

        <a href="#login" class="menu-item">
            Login
        </a>

    </nav>


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search-container">

        <input
            type="search"
            id="searchInput"
            placeholder="Cari novel..."
            autocomplete="off">

    </div>


    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <!-- NOVEL RANDOM -->

        <section class="novel-section" id="ongoing">

            <div class="section-title">

                <h2>Novel Random</h2>

            </div>

            <div
                class="novel-grid"
                id="randomNovels">
            </div>

        </section>


        <!-- LATEST UPDATE -->

        <section class="novel-section">

            <div class="section-title">

                <h2>Latest Update</h2>

            </div>

            <div
                class="novel-grid"
                id="latestUpdates">
            </div>


            <div
                class="pagination"
                id="pagination">
            </div>

        </section>


        <!-- SEARCH RESULTS -->

        <section
            class="novel-section"
            id="searchResultsSection"
            style="display: none;">

            <div class="section-title">

                <h2>Hasil Pencarian</h2>

            </div>

            <div
                class="novel-grid"
                id="searchResults">
            </div>

        </section>


    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="site-footer">

        <div>CN Novel-Translation</div>

        <div>Home • Donasi</div>

        <div>© Copyright 2026-CN Novel-Translation</div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           THEME
        ========================= */

        const themeButton =
            document.getElementById("themeButton");


        function loadTheme() {

            const savedTheme =
                localStorage.getItem("theme");

            if (savedTheme === "dark") {

                document.body.classList.add("dark");

                themeButton.textContent = "🌙";

            } else {

                document.body.classList.remove("dark");

                themeButton.textContent = "☀️";

            }

        }


        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {

                localStorage.setItem("theme", "dark");

                themeButton.textContent = "🌙";

            } else {

                localStorage.setItem("theme", "light");

                themeButton.textContent = "☀️";

            }

        });


        loadTheme();


        window.addEventListener("pageshow", function () {

            loadTheme();

        });


        /* =========================
           MENU
        ========================= */

        const menuButton =
            document.getElementById("menuButton");

        const menuClose =
            document.getElementById("menuClose");

        const menuOverlay =
            document.getElementById("menuOverlay");

        const sideMenu =
            document.getElementById("sideMenu");

        const menuNovel =
            document.getElementById("menuNovel");

        const novelSubmenu =
            document.getElementById("novelSubmenu");


        function openMenu() {

            sideMenu.classList.add("active");

            menuOverlay.classList.add("active");

            document.body.classList.add("menu-open");

            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );

        }


        function closeNovelSubmenu() {

            novelSubmenu.classList.remove("active");

            menuNovel.classList.remove("active");

            menuNovel.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        function closeMenu() {

            sideMenu.classList.remove("active");

            menuOverlay.classList.remove("active");

            document.body.classList.remove("menu-open");

            closeNovelSubmenu();

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        menuButton.addEventListener(
            "click",
            openMenu
        );


        menuClose.addEventListener(
            "click",
            closeMenu
        );


        menuOverlay.addEventListener(
            "click",
            closeMenu
        );


        /* =========================
           TOGGLE SUBMENU NOVEL
        ========================= */

        function toggleNovelSubmenu() {

            const isActive =
                novelSubmenu.classList.toggle("active");

            menuNovel.classList.toggle(
                "active",
                isActive
            );

            menuNovel.setAttribute(
                "aria-expanded",
                isActive
            );

        }


        menuNovel.addEventListener(
            "click",
            toggleNovelSubmenu
        );


        menuNovel.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    toggleNovelSubmenu();

                }

            }
        );


        /* =========================
           LINK MENU
        ========================= */

        const menuLinks =
            sideMenu.querySelectorAll("a");


        menuLinks.forEach(function (link) {

            link.addEventListener(
                "click",
                function () {

                    closeMenu();

                }
            );

        });


        /* =========================
           ESCAPE
        ========================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeMenu();

                }

            }
        );


        /* =========================
           DATA NOVEL
        ========================= */

        const novels = [

            {
                title: "Contoh Novel A",
                genre: "Fantasy • Romance",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 25,
                chapterTitle: "Chapter 25",
                link: "novel/judul-novel.html"
            },

            {
                title: "Contoh Novel B",
                genre: "Xianxia • Romance",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 103,
                chapterTitle: "Chapter 103",
                link: "#"
            },

            {
                title: "Contoh Novel C",
                genre: "Fantasy • Wuxia",
                status: "Completed",
                cover: "images/cover.jpg",
                chapter: 17,
                chapterTitle: "Chapter 17",
                link: "#"
            },

            {
                title: "Contoh Novel D",
                genre: "Xuanhuan • Romance",
                status: "Hiatus",
                cover: "images/cover.jpg",
                chapter: 42,
                chapterTitle: "Chapter 42",
                link: "#"
            },

            {
                title: "Contoh Novel E",
                genre: "Fantasy • Adventure",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 68,
                chapterTitle: "Chapter 68",
                link: "#"
            },

            {
                title: "Contoh Novel F",
                genre: "Xianxia • Fantasy",
                status: "On-going",
                cover: "images/cover.jpg",
                chapter: 91,
                chapterTitle: "Chapter 91",
                link: "#"
            }

        ];


        /* =========================
           RANDOM NOVELS
        ========================= */

        function showRandomNovels() {

            const container =
                document.getElementById(
                    "randomNovels"
                );

            const shuffled =
                [...novels].sort(
                    () => Math.random() - 0.5
                );

            const selected =
                shuffled.slice(0, 3);

            container.innerHTML =
                selected.map(createNovelCard).join("");

        }


        /* =========================
           NOVEL CARD
        ========================= */

        function createNovelCard(novel) {

            return `

                <article class="novel-card">

                    <a href="${novel.link}">

                        <img
                            src="${novel.cover}"
                            alt="${novel.title}">

                        <div class="novel-card-content">

                            <h3>
                                ${novel.title}
                            </h3>

                            <p>
                                ${novel.genre}
                            </p>

                            <span>
                                ${novel.chapterTitle}
                            </span>

                        </div>

                    </a>

                </article>

            `;

        }


        /* =========================
           LATEST UPDATE
        ========================= */

        const latestPerPage = 5;

        let currentPage = 1;


        function showLatestUpdates(page = 1) {

            const container =
                document.getElementById(
                    "latestUpdates"
                );

            const start =
                (page - 1) * latestPerPage;

            const end =
                start + latestPerPage;

            const pageNovels =
                novels.slice(start, end);

            container.innerHTML =
                pageNovels
                    .map(createNovelCard)
                    .join("");

            showPagination(page);

        }


        /* =========================
           PAGINATION
        ========================= */

        function showPagination(page) {

            const pagination =
                document.getElementById(
                    "pagination"
                );

            const totalPages =
                Math.ceil(
                    novels.length /
                    latestPerPage
                );

            pagination.innerHTML = "";


            for (
                let i = 1;
                i <= totalPages;
                i++
            ) {

                const button =
                    document.createElement("button");

                button.textContent = i;

                if (i === page) {

                    button.classList.add("active");

                }

                button.addEventListener(
                    "click",
                    function () {

                        currentPage = i;

                        showLatestUpdates(i);

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }
                );

                pagination.appendChild(button);

            }

        }


        /* =========================
           SEARCH
        ========================= */

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const searchResultsSection =
            document.getElementById(
                "searchResultsSection"
            );

        const searchResults =
            document.getElementById(
                "searchResults"
            );


        function performSearch(keyword) {

            keyword =
                keyword.trim().toLowerCase();


            if (!keyword) {

                searchResultsSection.style.display =
                    "none";

                document.querySelectorAll(
                    ".novel-section"
                )[0].style.display = "";

                document.querySelectorAll(
                    ".novel-section"
                )[1].style.display = "";

                return;

            }


            const results =
                novels.filter(function (novel) {

                    return novel.title
                        .toLowerCase()
                        .includes(keyword);

                });


            document.querySelectorAll(
                ".novel-section"
            )[0].style.display =
                "none";

            document.querySelectorAll(
                ".novel-section"
            )[1].style.display =
                "none";


            searchResultsSection.style.display =
                "";


            if (results.length === 0) {

                searchResults.innerHTML =
                    "<p>Tidak ada novel yang ditemukan.</p>";

                return;

            }


            searchResults.innerHTML =
                results
                    .map(createNovelCard)
                    .join("");

        }


        searchInput.addEventListener(
            "input",
            function () {

                performSearch(
                    searchInput.value
                );

            }
        );


        /* =========================
           URL SEARCH
        ========================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const urlSearch =
            urlParams.get("search");


        if (urlSearch) {

            searchInput.value = urlSearch;

            performSearch(urlSearch);

        }


        /* =========================
           INITIALIZE
        ========================= */

        showRandomNovels();

        showLatestUpdates(1);

    </script>

</body>

</html>
