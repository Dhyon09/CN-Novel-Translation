<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookmark - CN Novel-Translation</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =====================================================
           JUDUL HALAMAN
        ===================================================== */

        .bookmark-heading {
            margin-bottom: 18px;
        }

        .bookmark-heading h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }


        /* =====================================================
           GRID BOOKMARK
        ===================================================== */

        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }


        .bookmark-card {
            display: block;
            overflow: hidden;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background-color 0.4s ease,
                border-color 0.4s ease;
        }


        .bookmark-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px var(--shadow);
        }


        .bookmark-card img {
            display: block;

            width: 100%;
            height: 210px;

            object-fit: cover;
        }


        .bookmark-info {
            padding: 11px;
        }


        .bookmark-info h3 {
            margin: 0 0 6px;

            font-size: 16px;
            line-height: 1.35;

            word-break: break-word;
        }


        .bookmark-info p {
            margin: 0 0 6px;

            color: var(--secondary);

            font-size: 13px;
            line-height: 1.4;
        }


        .bookmark-info span {
            color: var(--primary);

            font-size: 13px;
        }


        /* =====================================================
           HAPUS BOOKMARK
        ===================================================== */

        .remove-bookmark {
            width: calc(100% - 22px);

            margin: 0 11px 11px;

            padding: 8px 10px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: transparent;
            color: var(--secondary);

            font-family: inherit;
            font-size: 13px;

            cursor: pointer;

            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }


        .remove-bookmark:hover {
            border-color: var(--primary);
            color: var(--primary);
        }


        /* =====================================================
           BOOKMARK KOSONG
        ===================================================== */

        .empty-bookmark {
            padding: 35px 15px;

            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);

            color: var(--secondary);

            text-align: center;

            line-height: 1.6;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (min-width: 600px) {

            .bookmark-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
            }


            .bookmark-card img {
                height: 230px;
            }

        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 900px) {

            .bookmark-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 16px;
            }


            .bookmark-card img {
                height: 260px;
            }

        }


        /* =====================================================
           HP KECIL
        ===================================================== */

        @media (max-width: 380px) {

            .bookmark-grid {
                gap: 9px;
            }


            .bookmark-info {
                padding: 9px;
            }


            .bookmark-info h3 {
                font-size: 15px;
            }


            .bookmark-card img {
                height: 185px;
            }


            .remove-bookmark {
                width: calc(100% - 18px);
                margin: 0 9px 9px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="header-left">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Buka menu"
            aria-expanded="false"
        >
            ☰
        </button>

    </div>


    <div class="site-title">
        CN Novel-Translation
    </div>


    <div class="header-right">

        <button
            class="theme-button"
            id="themeButton"
            aria-label="Ganti tema"
        >
            ☀️
        </button>

    </div>

</header>



<!-- =====================================================
     MENU OVERLAY
===================================================== -->

<div
    class="menu-overlay"
    id="menuOverlay"
></div>



<!-- =====================================================
     SIDE MENU
===================================================== -->

<nav
    class="side-menu"
    id="sideMenu"
>

    <div class="menu-header">

        <span>
            Menu
        </span>

        <button
            class="menu-close"
            id="menuClose"
            aria-label="Tutup menu"
        >
            ×
        </button>

    </div>


    <!-- NOVEL -->

    <div
        class="menu-item menu-novel"
        id="menuNovel"
        role="button"
        tabindex="0"
        aria-expanded="false"
    >

        <span>
            Novel
        </span>

        <span class="menu-arrow">
            ›
        </span>

    </div>


    <!-- SUBMENU NOVEL -->

    <div
        class="novel-submenu"
        id="novelSubmenu"
    >

        <a href="novel/on-going.html">
            On-going
        </a>

        <a href="novel/completed.html">
            Completed
        </a>

        <a href="novel/hiatus.html">
            Hiatus
        </a>

        <a href="novel/drop.html">
            Drop
        </a>

    </div>


    <!-- BOOKMARK -->

    <a
        href="bookmark.html"
        class="menu-item"
    >
        <span>
            Bookmark
        </span>
    </a>


    <!-- DONASI -->

    <a
        class="menu-item"
        href="https://trakteer.id/DhyonPratama"
        target="_blank"
        rel="noopener"
    >
        <span>
            Donasi
        </span>
    </a>


    <!-- LOGIN -->

    <a
        href="#login"
        class="menu-item"
    >
        <span>
            Login
        </span>
    </a>

</nav>



<!-- =====================================================
     SEARCH
===================================================== -->

<div class="global-search-bar">

    <div class="global-search-inner">

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="search"
                id="searchInput"
                placeholder="Cari novel..."
                autocomplete="off"
            >

        </div>

    </div>

</div>



<!-- =====================================================
     CONTENT
===================================================== -->

<main class="page-container">


    <div class="bookmark-heading">

        <h2>
            Bookmark
        </h2>

    </div>


    <div
        class="bookmark-grid"
        id="bookmarkGrid"
    ></div>


    <div
        class="empty-bookmark"
        id="emptyBookmark"
        style="display: none;"
    >

        Belum ada novel yang di-bookmark.

    </div>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="footer-title">
        CN Novel-Translation
    </div>


    <div class="footer-links">

        <a href="index.html">
            Home
        </a>

        <span>
            •
        </span>

        <a
            href="https://trakteer.id/DhyonPratama"
            target="_blank"
            rel="noopener"
        >
            Donasi
        </a>

    </div>


    <p class="copyright">
        © Copyright 2026-CN Novel-Translation
    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   MENU
===================================================== */

const menuButton =
    document.getElementById("menuButton");

const menuClose =
    document.getElementById("menuClose");

const menuOverlay =
    document.getElementById("menuOverlay");

const sideMenu =
    document.getElementById("sideMenu");

const menuNovel =
    document.getElementById("menuNovel");

const novelSubmenu =
    document.getElementById("novelSubmenu");


function openMenu() {

    sideMenu.classList.add("active");

    menuOverlay.classList.add("active");

    document.body.classList.add("menu-open");

    menuButton.setAttribute(
        "aria-expanded",
        "true"
    );

}


function closeNovelSubmenu() {

    novelSubmenu.classList.remove("active");

    menuNovel.classList.remove("active");

    menuNovel.setAttribute(
        "aria-expanded",
        "false"
    );

}


function closeMenu() {

    sideMenu.classList.remove("active");

    menuOverlay.classList.remove("active");

    document.body.classList.remove("menu-open");

    closeNovelSubmenu();

    menuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}


menuButton.addEventListener(
    "click",
    openMenu
);


menuClose.addEventListener(
    "click",
    closeMenu
);


menuOverlay.addEventListener(
    "click",
    closeMenu
);


/* =====================================================
   SUBMENU NOVEL
===================================================== */

function toggleNovelSubmenu() {

    const isActive =
        novelSubmenu.classList.toggle("active");


    menuNovel.classList.toggle(
        "active",
        isActive
    );


    menuNovel.setAttribute(
        "aria-expanded",
        isActive
    );

}


menuNovel.addEventListener(
    "click",
    toggleNovelSubmenu
);


menuNovel.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            toggleNovelSubmenu();

        }

    }
);


/* =====================================================
   MENU LINKS
===================================================== */

const menuLinks =
    sideMenu.querySelectorAll("a");


menuLinks.forEach(function (link) {

    link.addEventListener(
        "click",
        function () {

            closeMenu();

        }
    );

});


document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {

            closeMenu();

        }

    }
);



/* =====================================================
   DARK / LIGHT MODE
===================================================== */

const themeButton =
    document.getElementById("themeButton");


function loadTheme() {

    const savedTheme =
        localStorage.getItem("theme");


    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        themeButton.textContent = "🌙";

    } else {

        document.body.classList.remove("dark");

        themeButton.textContent = "☀️";

    }

}


themeButton.addEventListener(
    "click",
    function () {

        document.body.classList.toggle("dark");


        if (
            document.body.classList.contains("dark")
        ) {

            localStorage.setItem(
                "theme",
                "dark"
            );

            themeButton.textContent = "🌙";

        } else {

            localStorage.setItem(
                "theme",
                "light"
            );

            themeButton.textContent = "☀️";

        }

    }
);


loadTheme();


window.addEventListener(
    "pageshow",
    function () {

        loadTheme();

    }
);



/* =====================================================
   DATA BOOKMARK
===================================================== */

const bookmarkGrid =
    document.getElementById(
        "bookmarkGrid"
    );


const emptyBookmark =
    document.getElementById(
        "emptyBookmark"
    );


function loadBookmarks() {

    const bookmarks =
        JSON.parse(
            localStorage.getItem("bookmarks")
        ) || [];


    bookmarkGrid.innerHTML = "";


    if (bookmarks.length === 0) {

        emptyBookmark.style.display =
            "block";

        return;

    }


    emptyBookmark.style.display =
        "none";


    bookmarks.forEach(function (novel, index) {

        const card =
            document.createElement("article");


        card.className =
            "bookmark-card";


        card.innerHTML = `

            <a href="${novel.link}">

                <img
                    src="${novel.cover}"
                    alt="${novel.title}"
                >


                <div class="bookmark-info">

                    <h3>
                        ${novel.title}
                    </h3>


                    <p>
                        ${novel.genre}
                    </p>


                    <span>
                        ${novel.chapterTitle}
                    </span>

                </div>

            </a>


            <button
                class="remove-bookmark"
                type="button"
                data-index="${index}"
            >
                Hapus Bookmark
            </button>

        `;


        bookmarkGrid.appendChild(card);

    });


    const removeButtons =
        bookmarkGrid.querySelectorAll(
            ".remove-bookmark"
        );


    removeButtons.forEach(function (button) {

        button.addEventListener(
            "click",
            function () {

                const index =
                    Number(
                        button.dataset.index
                    );


                removeBookmark(index);

            }
        );

    });

}



/* =====================================================
   HAPUS BOOKMARK
===================================================== */

function removeBookmark(index) {

    const bookmarks =
        JSON.parse(
            localStorage.getItem("bookmarks")
        ) || [];


    bookmarks.splice(index, 1);


    localStorage.setItem(
        "bookmarks",
        JSON.stringify(bookmarks)
    );


    loadBookmarks();


    searchInput.value = "";

}



/* =====================================================
   SEARCH
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


searchInput.addEventListener(
    "input",
    function () {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        const cards =
            bookmarkGrid.querySelectorAll(
                ".bookmark-card"
            );


        cards.forEach(function (card) {

            const title =
                card.querySelector(
                    "h3"
                ).textContent
                .toLowerCase();


            if (
                title.includes(keyword)
            ) {

                card.style.display =
                    "";

            } else {

                card.style.display =
                    "none";

            }

        });

    }
);



/* =====================================================
   LOAD
===================================================== */

loadBookmarks();

</script>


</body>

</html>
