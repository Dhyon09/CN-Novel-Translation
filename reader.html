<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="Baca novel terjemahan di Yunxi.">
  <title>Baca Novel — Yunxi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Yunxi, beranda"><span class="brand-mark">L.</span><span class="brand-name">yunxi<small>PERPUSTAKAAN NOVEL</small></span></a>
    <nav aria-label="Navigasi utama"><a href="index.html">Beranda</a><a href="index.html#koleksi">Koleksi</a></nav>
    <button class="theme" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">☾</button>
  </header>
  <main class="reader">
    <a class="small" href="index.html#koleksi">← Kembali ke koleksi</a>
    <div class="reader-head"><p id="series" class="eyebrow">LINGXI · NOVEL</p><h1 id="chapterTitle">Memuat bab…</h1><p id="chapterMeta" class="muted"></p></div>
    <div class="controls"><button id="smaller" type="button">A− Kecilkan teks</button><button id="larger" type="button">A+ Besarkan teks</button><button id="readerTheme" type="button">☾ Tema</button></div>
    <article class="panel"><div id="chapterBody" class="chapter"></div></article>
    <div class="chapter-nav"><button id="prev" type="button">← Bab sebelumnya</button><select id="chapterSelect" aria-label="Pilih bab"></select><button id="next" class="primary" type="button">Bab berikutnya →</button></div>
    <p class="small" id="saveNote" style="margin-top:18px">Progres bacaan tersimpan di browser ini.</p>
  </main>
  <footer><a class="footer-brand" href="index.html">yunxi</a><span>Ruang kecil untuk kisah yang tinggal lama di hati.</span><a href="index.html#koleksi">Semua novel</a></footer>
  <script>
const $=s=>document.querySelector(s);let book=null,chapter=0,size=19;
function draw(){if(!book)return;const c=book.chapters[chapter];$("#series").textContent=book.title;$("#chapterTitle").textContent=c.title;$("#chapterMeta").textContent="Bab "+(chapter+1)+" dari "+book.chapters.length+" · "+(book.genres||[]).join(" · ");$("#chapterBody").innerHTML=c.content.split(/\n\n/).map(p=>"<p>"+p.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</p>").join("");$("#chapterSelect").value=chapter;$("#prev").disabled=chapter===0;$("#next").disabled=chapter===book.chapters.length-1;try{localStorage.setItem("yunxi-progress-"+book.id,String(chapter))}catch(e){}document.title=c.title+" — "+book.title+" | Yunxi"}
async function init(){try{if(localStorage.getItem("yunxi-theme")==="dark")document.body.classList.add("dark")}catch(e){}$("#themeToggle").onclick=toggleTheme;$("#readerTheme").onclick=toggleTheme;const id=new URLSearchParams(location.search).get("novel");try{const r=await fetch("data/novels.json");const books=await r.json();book=books.find(b=>b.id===id)||books[0];if(!book)throw Error();try{chapter=Math.min(Number(localStorage.getItem("yunxi-progress-"+book.id)||0),book.chapters.length-1)}catch(e){}$("#chapterSelect").innerHTML=book.chapters.map((c,i)=>'<option value="'+i+'">'+c.title.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</option>").join("");draw();$("#prev").onclick=()=>{if(chapter>0){chapter--;draw();window.scrollTo({top:0,behavior:"smooth"})}};$("#next").onclick=()=>{if(chapter<book.chapters.length-1){chapter++;draw();window.scrollTo({top:0,behavior:"smooth"})}};$("#chapterSelect").onchange=e=>{chapter=Number(e.target.value);draw()};$("#larger").onclick=()=>{$("#chapterBody").style.fontSize=(size=Math.min(29,size+1))+"px"};$("#smaller").onclick=()=>{$("#chapterBody").style.fontSize=(size=Math.max(14,size-1))+"px"}}catch(e){$("#chapterTitle").textContent="Novel belum tersedia";$("#chapterBody").textContent="Periksa kembali data/novels.json."}}
function toggleTheme(){document.body.classList.toggle("dark");try{localStorage.setItem("yunxi-theme",document.body.classList.contains("dark")?"dark":"light")}catch(e){}}
document.addEventListener("DOMContentLoaded",init);
  </script>
</body>
</html>
