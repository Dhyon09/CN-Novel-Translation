<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e9"><title>Baca Novel — Lingxi</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="seal">靈</span><span>LINGXI<small>PERPUSTAKAAN NOVEL TERJEMAHAN</small></span></a><nav><a href="index.html">Beranda</a><a href="index.html#koleksi">Koleksi</a></nav><button class="theme" id="themeToggle" aria-label="Ganti tema">☾</button></header><main class="reader"><a class="small" href="index.html">← Kembali ke koleksi</a><div class="reader-head"><p id="series" class="eyebrow">LINGXI · NOVEL</p><h1 id="chapterTitle">Memuat bab…</h1><p id="chapterMeta" class="muted"></p></div><div class="controls" style="margin-bottom:16px"><button id="smaller">A− Kecilkan teks</button><button id="larger">A+ Besarkan teks</button><button id="readerTheme">☾ Tema</button></div><article class="panel"><div id="chapterBody" class="chapter"></div></article><div class="chapter-nav"><button id="prev">← Bab sebelumnya</button><select id="chapterSelect" aria-label="Pilih bab"></select><button id="next" class="primary">Bab berikutnya →</button></div><p class="small" id="saveNote" style="margin-top:18px">Progres bacaan tersimpan di browser ini.</p></main><footer><a class="footer-brand" href="index.html">靈犀 <span>LINGXI</span></a><span>Ruang kecil untuk kisah yang tinggal lama di hati.</span><a href="index.html#koleksi">Semua novel</a></footer><script>
const $=s=>document.querySelector(s);let book=null,chapter=0,size=19;function draw(){if(!book)return;const c=book.chapters[chapter];$("#series").textContent=book.title;$("#chapterTitle").textContent=c.title;$("#chapterMeta").textContent="Bab "+(chapter+1)+" dari "+book.chapters.length+" · "+(book.genres||[]).join(" · ");$("#chapterBody").innerHTML=c.content.split(/\n\n/).map(p=>"<p>"+p.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</p>").join("");$("#chapterSelect").value=chapter;$("#prev").disabled=chapter===0;$("#next").disabled=chapter===book.chapters.length-1;localStorage.setItem("lingxi-progress-"+book.id,String(chapter));document.title=c.title+" — "+book.title+" | Lingxi"}async function init(){if(localStorage.getItem("lingxi-theme")==="dark")document.body.classList.add("dark");$("#themeToggle").onclick=toggleTheme;$("#readerTheme").onclick=toggleTheme;const id=new URLSearchParams(location.search).get("novel");try{const r=await fetch("data/novels.json");const books=await r.json();book=books.find(b=>b.id===id)||books[0];if(!book)throw Error();chapter=Math.min(Number(localStorage.getItem("lingxi-progress-"+book.id)||0),book.chapters.length-1);$("#chapterSelect").innerHTML=book.chapters.map((c,i)=>'<option value="'+i+'">'+c.title.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</option>').join("");draw();$("#prev").onclick=()=>{if(chapter>0){chapter--;draw();window.scrollTo({top:0,behavior:"smooth"})}};$("#next").onclick=()=>{if(chapter<book.chapters.length-1){chapter++;draw();window.scrollTo({top:0,behavior:"smooth"})}};$("#chapterSelect").onchange=e=>{chapter=Number(e.target.value);draw()};$("#larger").onclick=()=>{$("#chapterBody").style.fontSize=(size=Math.min(29,size+1))+"px"};$("#smaller").onclick=()=>{$("#chapterBody").style.fontSize=(size=Math.max(14,size-1))+"px"}}catch(e){$("#chapterTitle").textContent="Novel belum tersedia";$("#chapterBody").textContent="Periksa kembali data/novels.json.";}}function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("lingxi-theme",document.body.classList.contains("dark")?"dark":"light")}document.addEventListener("DOMContentLoaded",init);</script></body></html>
